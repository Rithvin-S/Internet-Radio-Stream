<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station Catalogue | PulseCast Radio</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Site Header & Navigation -->
    <header class="site-header" role="banner">
      <div class="header-container">
        <div class="brand">
          <img src="/assets/logo.svg" alt="PulseCast Logo" class="brand-logo" width="44" height="44">
          <div class="brand-text">
            <span class="brand-title">PulseCast</span>
            <span class="brand-subtitle">Station Catalogue</span>
          </div>
        </div>

        <nav class="site-nav" id="siteNav" aria-label="Main Navigation">
          <a href="/index.html" class="nav-link">Live Player</a>
          <a href="/stations.html" class="nav-link active">Stations</a>
          <a href="/login.html" class="nav-link">Sign In</a>
          <a href="/register.html" class="btn-sm btn-primary">Create Account</a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" role="main">
      <div class="player-container">
        <div class="stations-section">
          <!-- Search & Filter Bar -->
          <div class="filter-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by station name, genre, or keyword...">
            <div class="genre-filter-group" id="genreFilters">
              <button class="genre-pill active" data-genre="all">All Genres</button>
            </div>
          </div>

          <!-- Stations Grid -->
          <div class="stations-grid" id="stationsGrid">
            <div style="color:var(--text-muted); padding:2rem; grid-column:1/-1; text-align:center;">
              Loading station catalogue from MySQL database...
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-container">
        <p>&copy; 2026 PulseCast Full-Stack Internet Radio &bull; SRS v2.0 Compliant</p>
      </div>
    </footer>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/stations.js"></script>
</body>
</html>
