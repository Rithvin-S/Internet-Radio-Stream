<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="2.5" />
  
  <!-- Outer broadcast pulse wave -->
  <path d="M 28 42 A 40 40 0 0 1 92 42" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  <!-- Mid broadcast wave -->
  <path d="M 37 50 A 28 28 0 0 1 83 50" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <!-- Inner broadcast wave -->
  <path d="M 46 58 A 16 16 0 0 1 74 58" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Radio tower / antenna pole -->
  <path d="M 60 62 L 60 92" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
  <!-- Tower cross struts -->
  <path d="M 52 76 L 68 76" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 48 86 L 72 86" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Antenna glowing beacon tip -->
  <circle cx="60" cy="62" r="6" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="60" cy="62" r="3.5" fill="#ffffff" />
</svg>

