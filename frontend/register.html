<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | PulseCast Radio</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>
  <div class="app-wrapper">
    <header class="site-header">
      <div class="header-container">
        <div class="brand">
          <img src="/assets/logo.svg" alt="" class="brand-logo" width="44" height="44">
          <div class="brand-text">
            <span class="brand-title">PulseCast</span>
            <span class="brand-subtitle">Registration</span>
          </div>
        </div>
        <nav class="site-nav">
          <a href="/index.html" class="nav-link">Live Player</a>
          <a href="/stations.html" class="nav-link">Stations</a>
          <a href="/login.html" class="nav-link">Sign In</a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="auth-wrapper">
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Register as a listener to save your favourite stations across devices.</p>
        </div>

        <div id="errorBanner" class="form-error-banner" style="display: none;"></div>

        <form id="registerForm">
          <div class="form-group">
            <label for="nameInput">Full Name</label>
            <input type="text" id="nameInput" class="form-input" placeholder="e.g. Jordan Lee" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="emailInput">Email Address</label>
            <input type="email" id="emailInput" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="passwordInput">Password (min. 6 characters)</label>
            <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          </div>

          <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">Register Account</button>
        </form>

        <p style="text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1.25rem;">
          Already have an account? <a href="/login.html" style="color: var(--accent-cyan);">Sign in</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <p>&copy; 2026 PulseCast Full-Stack Internet Radio</p>
      </div>
    </footer>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const errorBanner = document.getElementById('errorBanner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.style.display = 'none';

        const name = document.getElementById('nameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        try {
          const resp = await apiClient.post('/auth/register', { name, email, password });
          if (resp && resp.token) {
            apiClient.setToken(resp.token);
            window.location.href = '/favourites.html';
          }
        } catch (err) {
          errorBanner.textContent = err.message || 'Registration failed.';
          errorBanner.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
