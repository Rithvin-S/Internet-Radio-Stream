<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | PulseCast Radio</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>
  <div class="app-wrapper">
    <header class="site-header">
      <div class="header-container">
        <div class="brand">
          <img src="/assets/logo.svg" alt="" class="brand-logo" width="44" height="44">
          <div class="brand-text">
            <span class="brand-title">PulseCast</span>
            <span class="brand-subtitle">Authentication</span>
          </div>
        </div>
        <nav class="site-nav">
          <a href="/index.html" class="nav-link">Live Player</a>
          <a href="/stations.html" class="nav-link">Stations</a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="auth-wrapper">
        <div class="auth-header">
          <h2>Sign In</h2>
          <p>Sign in to manage your favourite stations and access admin controls.</p>
        </div>

        <div id="errorBanner" class="form-error-banner" style="display: none;"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="emailInput">Email Address</label>
            <input type="email" id="emailInput" class="form-input" placeholder="you@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
        </form>

        <!-- Quick Demo Credentials Box for Evaluation -->
        <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-secondary);">
          <strong style="color: var(--text-primary); display: block; margin-bottom: 0.4rem;">Demo Accounts (Pre-seeded):</strong>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button id="fillAdminBtn" class="btn-sm btn-secondary" style="font-size: 0.75rem;">Fill Admin (admin@pulsecast.com)</button>
            <button id="fillListenerBtn" class="btn-sm btn-secondary" style="font-size: 0.75rem;">Fill Listener (listener@pulsecast.com)</button>
          </div>
        </div>

        <p style="text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1.25rem;">
          Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Create an account</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <p>&copy; 2026 PulseCast Full-Stack Internet Radio</p>
      </div>
    </footer>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const errorBanner = document.getElementById('errorBanner');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');

      // Demo auto-fill helpers
      document.getElementById('fillAdminBtn').addEventListener('click', () => {
        emailInput.value = 'admin@pulsecast.com';
        passwordInput.value = 'AdminPassword123!';
      });

      document.getElementById('fillListenerBtn').addEventListener('click', () => {
        emailInput.value = 'listener@pulsecast.com';
        passwordInput.value = 'ListenerPass123!';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        try {
          const resp = await apiClient.post('/auth/login', { email, password });
          if (resp && resp.token) {
            apiClient.setToken(resp.token);
            if (resp.user && resp.user.role === 'admin') {
              window.location.href = '/admin/stations.html';
            } else {
              window.location.href = '/favourites.html';
            }
          }
        } catch (err) {
          errorBanner.textContent = err.message || 'Login failed. Please check your credentials.';
          errorBanner.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
